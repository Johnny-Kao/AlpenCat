[workspace]
resolver = "2"
members = [
    "crates/runtime-api",
    "crates/runtime-core",
    "crates/runtime-selector",
    "crates/runtime-cpu-rayon",
    "crates/runtime-gpu-wgpu",
    "crates/runtime-machine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Johnny-Kao/AlpenCat"
publish = false
