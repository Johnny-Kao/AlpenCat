# Canonical upstream dependency map for the experimental runtime framework.
#
# Maintenance invariant:
# - Do not delete an entry when a dependency is removed.
# - Change status to "removed" or "replaced" and retain provenance.
# - Update wrapper_paths, contract, upgrade_checks, and history whenever the integration boundary changes.

schema_version = 2

# version_requirement is the manifest constraint; resolved_version records the Cargo.lock baseline actually validated.

[[dependency]]
id = "rayon"
kind = "runtime"
status = "active"
ownership = "external_mature"
convergence_state = "retain_wrapper"
package = "rayon"
version_requirement = "1.12.0"
resolved_version = "1.12.0"
upstream_repo = "https://github.com/rayon-rs/rayon"
wrapper_paths = ["crates/runtime-cpu-rayon/src/lib.rs"]
contract = ["parallel iteration over independent WorkRange indices", "bounded local ThreadPool construction via ThreadPoolBuilder::num_threads", "nested Rayon detection via rayon::current_thread_index"]
upgrade_checks = ["cargo test --workspace", "oversubscription_runtime: non-nested CPU path remains bounded", "oversubscription_runtime: nested Rayon collapses to serial", "calibrate vector_scale before changing performance assumptions"]
removal_rule = "Retain this entry as removed/replaced; record replacement CPU runtime and preserve execution-budget/nested-parallelism semantics."
notes = "Primary CPU execution wheel; all Rayon-specific behavior must stay behind runtime-cpu-rayon."

[[dependency]]
id = "wgpu"
kind = "runtime"
status = "active"
ownership = "external_mature"
convergence_state = "retain_wrapper"
package = "wgpu"
version_requirement = "30.0.1"
resolved_version = "30.0.1"
upstream_repo = "https://github.com/gfx-rs/wgpu"
enabled_features = ["std", "dx12", "metal", "vulkan", "wgsl"]
wrapper_paths = ["crates/runtime-gpu-wgpu/src/lib.rs"]
contract = ["device/queue acquisition", "WGSL compute pipeline creation", "storage-buffer upload", "compute dispatch", "copy/readback/map completion", "backend selection through wgpu environment/runtime support"]
upgrade_checks = ["cargo check --workspace on Rust 1.87 compatibility target", "cargo test --workspace", "verify enabled wgpu features remain limited to std/dx12/metal/vulkan/wgsl unless scope expands", "forced Vulkan vector_scale validation", "validate 2D dispatch for workloads above 65535 X workgroups", "re-run GPU initialization/round-trip/steady-state calibration", "run native Metal portability validation only with explicit approval if it can incur cost"]
history = ["2026-10-01: disabled wgpu default features and retained only std/dx12/metal/vulkan/wgsl; Rust 1.87 workspace check PASS; forced Vulkan vector_scale PASS; native paid Metal validation not run."]
removal_rule = "Retain this entry as removed/replaced; record replacement GPU abstraction and map all GPU adapter contract points."
notes = "Primary portable GPU wheel; wgpu-specific types must remain behind runtime-gpu-wgpu. Default features are disabled; desktop feature surface is intentionally limited to std, DX12, Metal, Vulkan, and WGSL."

[[dependency]]
id = "bytemuck"
kind = "adapter_support"
status = "active"
ownership = "external_support"
convergence_state = "retain_wrapper"
package = "bytemuck"
version_requirement = "1.24.0"
resolved_version = "1.25.2"
upstream_repo = "https://github.com/Lokathor/bytemuck"
wrapper_paths = ["crates/runtime-gpu-wgpu/src/lib.rs"]
contract = ["cast f32 slices to byte slices for GPU buffer upload", "cast mapped readback bytes to f32 slices"]
upgrade_checks = ["cargo test --workspace", "forced GPU vector_scale matches serial", "GPU round-trip returns byte-identical f32 values"]
removal_rule = "Retain record and document replacement byte-casting mechanism plus alignment/POD safety assumptions."
notes = "Small support wheel inside the GPU wrapper; not exposed through public API."

[[dependency]]
id = "pollster"
kind = "adapter_support"
status = "active"
ownership = "external_support"
convergence_state = "review_host_executor"
package = "pollster"
version_requirement = "0.4.0"
resolved_version = "0.4.0"
upstream_repo = "https://github.com/zesterer/pollster"
wrapper_paths = ["crates/runtime-gpu-wgpu/src/lib.rs"]
contract = ["synchronously block on wgpu adapter request", "synchronously block on wgpu device request"]
upgrade_checks = ["cargo test --workspace", "GPU adapter initialization succeeds in supported environment"]
removal_rule = "Retain record and document the replacement synchronous/async bridge and any runtime/reactor requirement."
notes = "May be removable if the host already provides a suitable async executor; do not duplicate async runtimes without evidence."

[[dependency]]
id = "ordered-float-msrv-pin"
kind = "compatibility_pin"
status = "active"
ownership = "compatibility_pin"
convergence_state = "remove_when_constraint_clears"
package = "ordered-float"
version_requirement = "=5.3.0"
resolved_version = "5.3.0"
upstream_repo = "crates.io:ordered-float"
wrapper_paths = ["crates/runtime-gpu-wgpu/Cargo.toml", "Cargo.lock"]
contract = ["constrain wgpu transitive resolution so the workspace remains compatible with Rust 1.87"]
upgrade_checks = ["remove the explicit pin in a temporary branch", "cargo update", "cargo check --workspace with Rust 1.87", "if resolution remains Rust-1.87-compatible, remove pin and mark this entry removed"]
removal_rule = "Never silently delete this pin. Mark removed and record the wgpu/dependency resolution that made it unnecessary."
notes = "Not used by our source code. Added after unconstrained resolution selected ordered-float 5.5.0 requiring Rust 1.90 while the project validation target remained Rust 1.87."
