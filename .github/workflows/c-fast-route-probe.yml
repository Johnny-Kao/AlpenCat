name: C FastRoute Probe

on:
  push:
    branches:
      - experiment/c-fast-route-poc
  workflow_dispatch:

jobs:
  native-c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Runner metadata
        run: |
          uname -a || true
          clang --version || true

      - name: Build correctness test
        run: |
          clang -O3 -std=c11             experiments/c-fast-route/alpencat_fast_route.c             experiments/c-fast-route/test.c             -o fast_route_test

      - name: Run correctness test
        run: |
          ./fast_route_test

      - name: Build benchmark
        run: |
          clang -O3 -std=c11             experiments/c-fast-route/alpencat_fast_route.c             experiments/c-fast-route/bench.c             -o fast_route_bench

      - name: Run benchmark
        run: |
          ./fast_route_bench

      - name: Build exact-cache capacity probe
        if: runner.os != 'Windows'
        run: |
          clang -O3 -std=c11 \
            experiments/c-fast-route/alpencat_fast_route.c \
            experiments/c-fast-route/replay_cache_capacity.c \
            -o replay_cache_capacity

      - name: Run exact-cache capacity probe
        if: runner.os != 'Windows'
        run: |
          ./replay_cache_capacity

      - name: Build policy-churn probe
        if: runner.os != 'Windows'
        run: |
          clang -O3 -std=c11 \
            experiments/c-fast-route/alpencat_fast_route.c \
            experiments/c-fast-route/replay_policy_churn.c \
            -o replay_policy_churn

      - name: Run policy-churn probe
        if: runner.os != 'Windows'
        run: |
          ./replay_policy_churn

      - name: Build FIR replay
        if: runner.os != 'Windows'
        run: |
          clang -O3 -std=c11 \
            experiments/c-fast-route/alpencat_fast_route.c \
            experiments/c-fast-route/replay_fir.c \
            -o replay_fir

      - name: Run FIR replay
        if: runner.os != 'Windows'
        run: |
          ./replay_fir

      - name: Build FIR cache replay
        if: runner.os != 'Windows'
        run: |
          clang -O3 -std=c11 \
            experiments/c-fast-route/alpencat_fast_route.c \
            experiments/c-fast-route/replay_fir_cache.c \
            -o replay_fir_cache

      - name: Run FIR cache replay
        if: runner.os != 'Windows'
        run: |
          ./replay_fir_cache

  rust-to-c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build C static library
        run: |
          cc -O3 -std=c11 -c             experiments/c-fast-route/alpencat_fast_route.c             -o /tmp/alpencat_fast_route.o
          ar rcs /tmp/libalpencat_fast_route.a /tmp/alpencat_fast_route.o

      - name: Build Rust -> C FFI benchmark
        run: |
          rustc -O             experiments/c-fast-route/bench_rust.rs             -L native=/tmp             -o /tmp/alpencat_fast_route_rust

      - name: Run Rust -> C FFI benchmark
        run: |
          /tmp/alpencat_fast_route_rust
