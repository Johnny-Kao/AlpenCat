name: AlpenCat Validation Campaign v2

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/c-fast-route-poc
    paths:
      - "validation/validation-matrix-v2.json"
      - ".github/workflows/validation-matrix-v2.yml"
      - "validation/analyze-campaign-v2.py"
      - "experiments/target-scenario/**"
      - "benchmarks/fast-route-e2e/**"
      - "experiments/c-fast-route/**"

jobs:
  host:
    name: host-${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            os: ubuntu-24.04
            perf: true
          - id: linux-arm64
            os: ubuntu-24.04-arm
            perf: true
          - id: macos-intel
            os: macos-15-intel
            perf: true
          - id: macos-arm64
            os: macos-15
            perf: true
          - id: windows-x64
            os: windows-2025
            perf: false
          - id: windows-arm64
            os: windows-11-arm
            perf: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Unix campaign
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-results
          {
            echo "matrix_id=${{ matrix.id }}"
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            uname -a
            sysctl -n machdep.cpu.brand_string 2>/dev/null || true
            sysctl -n hw.memsize 2>/dev/null || true
            lscpu 2>/dev/null || true
            free -b 2>/dev/null || true
            system_profiler SPHardwareDataType SPDisplaysDataType 2>/dev/null || true
          } > validation-results/metadata.txt

          cargo test --release --manifest-path crates/runtime-cost-model/Cargo.toml \
            | tee validation-results/core-tests.txt

          if [[ "${{ matrix.perf }}" == "true" ]]; then
            for rep in 1 2 3 4 5; do
              cargo run --release --manifest-path benchmarks/fast-route-e2e/Cargo.toml \
                > "validation-results/fast-route-${rep}.txt"
            done
          fi

      - name: Windows campaign
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation-results | Out-Null
          "matrix_id=${{ matrix.id }}" | Out-File validation-results/metadata.txt
          "sha=${env:GITHUB_SHA}" | Out-File validation-results/metadata.txt -Append
          Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors |
            Out-String | Out-File validation-results/metadata.txt -Append
          Get-CimInstance Win32_ComputerSystem | Format-List TotalPhysicalMemory,Model,Manufacturer |
            Out-String | Out-File validation-results/metadata.txt -Append
          cargo test --release --manifest-path crates/runtime-cost-model/Cargo.toml *>&1 |
            Tee-Object -FilePath validation-results/core-tests.txt

      - uses: actions/upload-artifact@v4
        with:
          name: validation-v2-${{ matrix.id }}-${{ github.run_id }}
          path: validation-results/
          retention-days: 30

  heterogeneous:
    name: heterogeneous-macos-arm64
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build full fixed suite once
        run: |
          mkdir -p campaign-results
          clang++ -O3 -std=c++17 -fobjc-arc experiments/target-scenario/metal_fir_bench.mm \
            -framework Foundation -framework Metal -o /tmp/fir
          clang++ -O3 -std=c++17 -fobjc-arc experiments/target-scenario/metal_fft_bench.mm \
            -framework Foundation -framework Metal -o /tmp/fft
          clang++ -O3 -std=c++17 -fobjc-arc experiments/target-scenario/metal_reduction_bench.mm \
            -framework Foundation -framework Metal -o /tmp/reduction
          clang++ -O3 -std=c++17 -fobjc-arc experiments/target-scenario/metal_conv2d_bench.mm \
            -framework Foundation -framework Metal -o /tmp/conv
          clang++ -O3 -std=c++17 -fobjc-arc experiments/target-scenario/load_generator.mm \
            -framework Foundation -framework Metal -pthread -o /tmp/loadgen

      - name: Run all kernels and all load profiles in one runner
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            uname -a
            sysctl -n machdep.cpu.brand_string || true
            sysctl -n hw.memsize || true
            system_profiler SPHardwareDataType SPDisplaysDataType || true
          } > campaign-results/metadata.txt

          LOAD_PID=""
          stop_load() {
            if [[ -n "${LOAD_PID:-}" ]]; then
              kill "$LOAD_PID" 2>/dev/null || true
              wait "$LOAD_PID" 2>/dev/null || true
              LOAD_PID=""
            fi
          }
          start_load() {
            local scenario="$1"
            case "$scenario" in
              idle_pre|idle_post) ;;
              mem_bw|cpu_light|game_like|gpu_light)
                /tmp/loadgen "$scenario" > "campaign-results/load-${scenario}.txt" 2>&1 &
                LOAD_PID=$!
                sleep 2
                ;;
              *) echo "unknown scenario=$scenario" >&2; exit 2 ;;
            esac
          }
          trap stop_load EXIT

          # Frozen order. No mid-run retuning.
          for scenario in idle_pre mem_bw cpu_light game_like gpu_light idle_post; do
            start_load "$scenario"
            for rep in 1 2 3 4 5; do
              ALPENCAT_FOCUS=1 /tmp/fir > "campaign-results/fir_${scenario}_${rep}.txt"
              /tmp/fft > "campaign-results/fft_${scenario}_${rep}.txt"
              /tmp/reduction > "campaign-results/reduction_${scenario}_${rep}.txt"
              /tmp/conv > "campaign-results/conv_${scenario}_${rep}.txt"
            done
            vm_stat > "campaign-results/vm_${scenario}.txt" || true
            stop_load
            sleep 2
          done

      - name: Analyze static vs localized boundary
        run: |
          python3 validation/analyze-campaign-v2.py | tee campaign-results/summary.md

      - uses: actions/upload-artifact@v4
        with:
          name: validation-v2-heterogeneous-${{ github.run_id }}
          path: campaign-results/
          retention-days: 30
