name: AlpenCat upfirdn Adaptive Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "benchmarks/upfirdn-adaptive/**"
      - "crates/runtime-api/**"
      - "crates/runtime-cost-model/**"
      - "crates/runtime-cpu-rayon/**"
      - ".github/workflows/runtime-upfirdn-adaptive-benchmark.yml"

concurrency:
  group: alpencat-upfirdn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upfirdn-adaptive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0

      - name: Run real FIR adaptive benchmark
        working-directory: benchmarks/upfirdn-adaptive
        run: |
          set -o pipefail
          cargo run --release | tee upfirdn-adaptive.txt

      - name: Record runner metadata
        run: |
          {
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "runner_os=${RUNNER_OS}"
            uname -a
            lscpu
            free -h
          } > benchmarks/upfirdn-adaptive/runner-metadata.txt

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: upfirdn-adaptive-${{ github.run_id }}
          path: |
            benchmarks/upfirdn-adaptive/upfirdn-adaptive.txt
            benchmarks/upfirdn-adaptive/runner-metadata.txt
          retention-days: 30
