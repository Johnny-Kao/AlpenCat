name: AlpenCat Multi-Kernel Load Validation

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/c-fast-route-poc
    paths:
      - "experiments/target-scenario/analyze_multikernel_load.py"
      - ".github/workflows/target-scenario-multikernel-load.yml"

jobs:
  load-matrix:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build benchmarks and load generator
        run: |
          mkdir -p multikernel_load
          clang++ -O3 -std=c++17 -fobjc-arc \
            experiments/target-scenario/metal_fft_bench.mm \
            -framework Foundation -framework Metal -o /tmp/metal_fft_bench
          clang++ -O3 -std=c++17 -fobjc-arc \
            experiments/target-scenario/metal_reduction_bench.mm \
            -framework Foundation -framework Metal -o /tmp/metal_reduction_bench
          clang++ -O3 -std=c++17 -fobjc-arc \
            experiments/target-scenario/load_generator.mm \
            -framework Foundation -framework Metal -pthread -o /tmp/alpencat_load
          {
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            uname -a
            sysctl -n machdep.cpu.brand_string || true
            sysctl hw.memsize || true
            system_profiler SPHardwareDataType SPDisplaysDataType || true
          } > multikernel_load/runner_metadata.txt

      - name: Run controlled scenarios
        shell: bash
        run: |
          set -euo pipefail
          LOAD_PID=""
          stop_load() {
            if [[ -n "${LOAD_PID:-}" ]]; then
              kill "$LOAD_PID" 2>/dev/null || true
              wait "$LOAD_PID" 2>/dev/null || true
              LOAD_PID=""
            fi
          }
          start_load() {
            local s="$1"
            case "$s" in
              idle_pre|idle_post) ;;
              cpu_light|gpu_light|mem_bw|game_like)
                /tmp/alpencat_load "$s" > "multikernel_load/load_${s}.log" 2>&1 &
                LOAD_PID=$!
                sleep 3
                ;;
            esac
          }
          trap stop_load EXIT
          for scenario in idle_pre cpu_light gpu_light mem_bw game_like idle_post; do
            start_load "$scenario"
            for rep in 1 2 3 4 5; do
              /tmp/metal_fft_bench > "multikernel_load/fft_${scenario}_${rep}.txt"
              /tmp/metal_reduction_bench > "multikernel_load/reduction_${scenario}_${rep}.txt"
            done
            vm_stat > "multikernel_load/vm_${scenario}.txt" || true
            stop_load
            sleep 2
          done

      - name: Analyze load-sensitive crossover
        run: |
          python3 experiments/target-scenario/analyze_multikernel_load.py \
            | tee multikernel_load/summary.md

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: multikernel-load-${{ github.run_id }}
          path: multikernel_load/
          retention-days: 30
