name: C FastRoute E2E

on:
  push:
    branches:
      - experiment/c-fast-route-poc
  workflow_dispatch:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Run native-kernel benchmark
        run: |
          cargo run --release --manifest-path benchmarks/fast-route-e2e/Cargo.toml
