name: Switching Economics Validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/convergence-adaptive-compute-sdk
    paths:
      - "experiments/convergence/analyze_adaptation_economics.py"
      - "experiments/convergence/analyze_switching_economics.py"
      - "experiments/convergence/classify_candidate_miss.py"
      - "experiments/convergence/test_analyze_switching_economics.py"
      - "experiments/convergence/test_classify_candidate_miss.py"
      - "experiments/convergence/run_w2_evidence_matrix.sh"
      - "experiments/convergence/run_w3_evidence_matrix.sh"
      - "crates/runtime-api/examples/evidence_memory_workload.rs"
      - "crates/runtime-api/examples/evidence_mixed_workload.rs"
      - ".github/workflows/switching-economics.yml"

concurrency:
  group: switching-economics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  switching-economics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Test generic economics analyzers
        run: |
          python3 -m unittest experiments/convergence/test_analyze_switching_economics.py -v
          python3 -m unittest experiments/convergence/test_classify_candidate_miss.py -v

      - name: Run W2 evidence matrix
        env:
          ALPENCAT_REPEATS: "7"
          ALPENCAT_WARMUP_PAIRS: "2"
          ALPENCAT_CALLS_PER_POINT: "100"
        run: |
          ALPENCAT_W2_OUT="$PWD/switching-evidence-w2" bash experiments/convergence/run_w2_evidence_matrix.sh
          python3 experiments/convergence/analyze_adaptation_economics.py switching-evidence-w2
          python3 experiments/convergence/analyze_switching_economics.py switching-evidence-w2
          python3 experiments/convergence/classify_candidate_miss.py \
            switching-evidence-w2/switching-economics.json \
            > switching-evidence-w2/candidate-miss.json

      - name: Run W3 evidence matrix
        env:
          ALPENCAT_REPEATS: "7"
          ALPENCAT_WARMUP_PAIRS: "2"
          ALPENCAT_CALLS_PER_POINT: "100"
        run: |
          ALPENCAT_W3_OUT="$PWD/switching-evidence-w3" bash experiments/convergence/run_w3_evidence_matrix.sh
          python3 experiments/convergence/analyze_switching_economics.py switching-evidence-w3
          python3 experiments/convergence/analyze_demand_bridge_control.py switching-evidence-w3

      - name: Upload switching economics evidence
        uses: actions/upload-artifact@v4
        with:
          name: switching-economics-${{ github.run_id }}
          path: |
            switching-evidence-w2/
            switching-evidence-w2-sensitivity/
            switching-evidence-w3/
          retention-days: 7
      - name: Run W3 evidence matrix
        env:
          ALPENCAT_REPEATS: "7"
          ALPENCAT_WARMUP_PAIRS: "2"
          ALPENCAT_CALLS_PER_POINT: "100"
        run: |
          ALPENCAT_W3_OUT="$PWD/switching-evidence-w3" bash experiments/convergence/run_w3_evidence_matrix.sh
          python3 experiments/convergence/analyze_switching_economics.py switching-evidence-w3

      - name: Upload switching economics evidence
        uses: actions/upload-artifact@v4
        with:
          name: switching-economics-${{ github.run_id }}
          path: |
            switching-evidence-w2/
            switching-evidence-w2-sensitivity/
            switching-evidence-w3/
          retention-days: 7
