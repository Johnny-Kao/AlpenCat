name: W2 Replication

on:
  push:
    branches:
      - research/convergence-adaptive-compute-sdk
    paths:
      - .github/workflows/w2-replication.yml
      - experiments/convergence/analyze_w2_escalation.py
      - experiments/convergence/analyze_w2_cross_runner_policy.py
      - experiments/convergence/test_analyze_w2_cross_runner_policy.py
  workflow_dispatch:

jobs:
  replicate:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0

      - name: Run warmed W2 evidence
        env:
          ALPENCAT_REPEATS: "7"
          ALPENCAT_WARMUP_PAIRS: "2"
          ALPENCAT_CALLS_PER_POINT: "100"
          ALPENCAT_W2_OUT: "w2-replica-${{ matrix.replica }}"
        run: |
          bash experiments/convergence/run_w2_evidence_matrix.sh
          echo "=== CPU ==="
          grep -E 'Model name|Vendor ID|CPU\(s\)' "w2-replica-${{ matrix.replica }}/manifest.txt" || true

      - name: Run warmed p3 sensitivity
        env:
          ALPENCAT_REPEATS: "7"
          ALPENCAT_WARMUP_PAIRS: "2"
          ALPENCAT_W2_SENSITIVITY_OUT: "w2-sens-${{ matrix.replica }}"
        run: bash experiments/convergence/run_w2_budget_sensitivity.sh

      - name: Price escalation
        run: |
          python3 experiments/convergence/analyze_w2_escalation.py             "w2-replica-${{ matrix.replica }}"             "w2-sens-${{ matrix.replica }}"             --warmup-pairs 2

      - name: Upload compact evidence
        uses: actions/upload-artifact@v4
        with:
          name: w2-replica-${{ matrix.replica }}-${{ github.run_id }}
          path: |
            w2-replica-${{ matrix.replica }}/manifest.txt
            w2-replica-${{ matrix.replica }}/*.jsonl
            w2-replica-${{ matrix.replica }}/economics-summary.*
            w2-replica-${{ matrix.replica }}/policy-summary.csv
            w2-replica-${{ matrix.replica }}/escalation-policy.*
            w2-sens-${{ matrix.replica }}/summary.csv
          retention-days: 3

  aggregate-policy:
    needs: replicate
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Download replica evidence
        uses: actions/download-artifact@v4
        with:
          pattern: w2-replica-*-${{ github.run_id }}
          path: w2-cross-runner-input
          merge-multiple: false

      - name: Test cross-runner policy simulator
        run: python3 -m unittest experiments/convergence/test_analyze_w2_cross_runner_policy.py -v

      - name: Simulate economic-gated policy
        run: |
          python3 experiments/convergence/analyze_w2_cross_runner_policy.py \
            w2-cross-runner-input \
            --output w2-cross-runner-policy

      - name: Upload cross-runner policy simulation
        uses: actions/upload-artifact@v4
        with:
          name: w2-cross-runner-policy-${{ github.run_id }}
          path: w2-cross-runner-policy/
          retention-days: 7
