name: Convergence Smoke

on:
  push:
    branches:
      - research/convergence-adaptive-compute-sdk
  workflow_dispatch:

concurrency:
  group: convergence-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closed-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.87 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check convergence code
        run: cargo clippy -p runtime-api --all-targets -- -D warnings

      - name: Test runtime API and convergence closed loop
        run: cargo test -p runtime-api -- --nocapture

      - name: Test economics analyzers
        run: |
          python3 -m unittest experiments/convergence/test_analyze_economics.py -v
          python3 -m unittest experiments/convergence/test_analyze_adaptation_economics.py -v
          python3 -m unittest experiments/convergence/test_analyze_switching_economics.py -v
          python3 -m unittest experiments/convergence/test_analyze_profile_shape.py -v

      - name: Run E0 evidence matrix
        env:
          ALPENCAT_REPEATS: "3"
          ALPENCAT_CALLS_PER_POINT: "100"
        run: bash experiments/convergence/run_evidence_matrix.sh

      - name: Upload E0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: convergence-e0-${{ github.run_id }}
          path: evidence-results/
          retention-days: 7

      - name: Run W2 memory-sensitive evidence matrix
        env:
          ALPENCAT_REPEATS: "7"
          ALPENCAT_WARMUP_PAIRS: "2"
          ALPENCAT_CALLS_PER_POINT: "100"
        run: bash experiments/convergence/run_w2_evidence_matrix.sh

      - name: Upload W2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: convergence-w2-${{ github.run_id }}
          path: evidence-w2-results/
          retention-days: 7

      - name: Probe W2 revalidation budget sensitivity
        env:
          ALPENCAT_REPEATS: "7"
          ALPENCAT_WARMUP_PAIRS: "2"
        run: bash experiments/convergence/run_w2_budget_sensitivity.sh

      - name: Analyze W2 adaptation economics
        run: |
          python3 experiments/convergence/analyze_adaptation_economics.py \
            evidence-w2-results \
            --sensitivity-root w2-budget-sensitivity

      - name: Analyze W2 profile shape
        run: |
          python3 experiments/convergence/analyze_profile_shape.py \
            evidence-w2-results

      - name: Test W2 economic escalation analyzer
        run: python3 -m unittest experiments/convergence/test_analyze_w2_escalation.py -v

      - name: Analyze W2 economic escalation
        run: |
          python3 experiments/convergence/analyze_w2_escalation.py \
            evidence-w2-results w2-budget-sensitivity \
            --warmup-pairs 2

      - name: Upload W2 adaptation economics
        uses: actions/upload-artifact@v4
        with:
          name: convergence-w2-adaptation-${{ github.run_id }}
          path: |
            evidence-w2-results/adaptation-economics.json
            evidence-w2-results/adaptation-economics.csv
            evidence-w2-results/adaptation-economics.md
            evidence-w2-results/adaptation-budget-sensitivity.csv
            evidence-w2-results/profile-shape.json
            evidence-w2-results/profile-shape.csv
            evidence-w2-results/profile-shape.md
            evidence-w2-results/escalation-policy.json
            evidence-w2-results/escalation-policy.csv
            evidence-w2-results/escalation-policy.md
          retention-days: 7

      - name: Upload W2 budget sensitivity
        uses: actions/upload-artifact@v4
        with:
          name: convergence-w2-budget-${{ github.run_id }}
          path: w2-budget-sensitivity/
          retention-days: 7
