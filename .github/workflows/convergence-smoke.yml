name: Convergence Smoke

on:
  push:
    branches:
      - research/convergence-adaptive-compute-sdk
  workflow_dispatch:

concurrency:
  group: convergence-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closed-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.87 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check convergence code
        run: cargo clippy -p runtime-api --all-targets -- -D warnings

      - name: Test runtime API and convergence closed loop
        run: cargo test -p runtime-api -- --nocapture

      - name: Run real compute workload across resource envelopes
        run: bash experiments/convergence/run_resource_envelope.sh

      - name: Upload convergence smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: convergence-smoke-${{ github.run_id }}
          path: convergence-results/
          retention-days: 7
