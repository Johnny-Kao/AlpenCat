name: v0.5 Adaptation Economics Screening
on:
  push:
    branches: [research/v0.5-adaptation-economics]
    paths:
      - 'experiments/v05/**'
      - '.github/workflows/v05-adaptation-economics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v05-economics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screening:
    name: ${{ matrix.os }} sample-${{ matrix.sample }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        sample: [1, 2]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0
      - name: Run existing-workload paired economics and CPU/RSS accounting
        run: python3 experiments/v05/screen_economics.py --out "v05-results/${{ matrix.os }}-s${{ matrix.sample }}" --repeats 5
      - name: Preserve positive and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v05-${{ matrix.os }}-s${{ matrix.sample }}-${{ github.run_id }}
          path: v05-results/
          retention-days: 14
          if-no-files-found: warn
