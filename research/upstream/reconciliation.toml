  [[source.transform]]
  id = "ordered-float-rust187-pin"
  upstream_unit = "dependency resolver choice"
  downstream_unit = "crates/runtime-gpu-wgpu/Cargo.toml"
  action = "override"
  canonical_owner = "runtime-gpu-wgpu manifest"
