# Global upstream reconciliation ledger.
#
# This file tracks the relationship between:
# U0 = imported upstream baseline
# U1 = later upstream state
# D  = transformed downstream implementation
# M  = transformation mapping recorded here
#
# Do not delete historical source/transformation entries when code is deduplicated,
# overridden, replaced, or removed. Mark their state and retain lineage.

schema_version = 2

[policy]
update_model = "four_way_reconciliation"
baseline_symbol = "U0"
latest_upstream_symbol = "U1"
downstream_symbol = "D"
mapping_symbol = "M"
advance_baseline_only_after_validation = true
preserve_removed_transformations = true

[[source]]
id = "rayon"
upstream_repo = "https://github.com/rayon-rs/rayon"
import_mode = "external_dependency"
baseline_ref = "crate:rayon@1.12.0"
observed_upstream_ref = "UNSET"
downstream_owner = "crates/runtime-cpu-rayon"
sync_state = "baseline_recorded"
sync_policy = "wrapper_reconcile"
notes = "Current prototype consumes Rayon as a dependency rather than vendoring its source. The ledger still treats the wrapper contract as the downstream transformation boundary."

  [[source.transform]]
  id = "rayon-cpu-execution"
  upstream_unit = "Rayon parallel iteration / ThreadPoolBuilder / current_thread_index"
  downstream_unit = "crates/runtime-cpu-rayon/src/lib.rs"
  action = "connector_wrapper"
  canonical_owner = "runtime-cpu-rayon"
  semantic_contract = "bounded CPU execution; bounded Rayon pools are reused per CpuAdapter by max_parallelism; nested Rayon collapses to serial; public API exposes no Rayon types"
  upstream_change_policy = "review_wrapper_contract"
  validation = ["cargo test --workspace", "oversubscription_runtime", "runtime-cpu-rayon pool reuse unit tests", "compare_pool_reuse benchmark"]
  history = ["2026-10-01: replaced per-call ThreadPoolBuilder::build with per-CpuAdapter pool reuse keyed by max_parallelism after measuring ~18-22 us/call rebuild tax; full workspace tests PASS."]

[[source]]
id = "wgpu"
upstream_repo = "https://github.com/gfx-rs/wgpu"
import_mode = "external_dependency"
baseline_ref = "crate:wgpu@30.0.1"
observed_upstream_ref = "UNSET"
downstream_owner = "crates/runtime-gpu-wgpu"
sync_state = "baseline_recorded"
sync_policy = "wrapper_reconcile"
notes = "Current prototype consumes wgpu as a dependency. Default feature surface has been reduced downstream."

  [[source.transform]]
  id = "wgpu-feature-prune"
  upstream_unit = "wgpu default feature set"
  downstream_unit = "crates/runtime-gpu-wgpu/Cargo.toml"
  action = "deduplicate_or_prune"
  canonical_owner = "runtime-gpu-wgpu manifest"
  retained = ["std", "dx12", "metal", "vulkan", "wgsl"]
  removed = ["unused default features outside current desktop target"]
  semantic_contract = "retain portable desktop GPU execution required by the runtime while avoiding unused backend/features"
  upstream_change_policy = "recompute_feature_delta"
  validation = ["Rust 1.87 cargo check --workspace", "forced Vulkan vector_scale"]

  [[source.transform]]
  id = "wgpu-runtime-wrapper"
  upstream_unit = "adapter/device/queue/shader/buffer/dispatch/readback APIs"
  downstream_unit = "crates/runtime-gpu-wgpu/src/lib.rs"
  action = "connector_wrapper"
  canonical_owner = "runtime-gpu-wgpu"
  semantic_contract = "GPU-specific APIs remain behind adapter; runtime public contract stays backend-neutral; prepared pipeline resources may be reused behind the adapter boundary"
  upstream_change_policy = "review_wrapper_contract"
  validation = ["cargo test --workspace", "forced Vulkan vector_scale", "compare_pipeline_reuse benchmark", "GPU calibration when execution semantics change"]
  history = ["2026-10-01: added PreparedF32Kernel adapter primitive for measured pipeline-reuse comparison; measured rebuild tax ~100-124 us/call on Mesa Vulkan; no upstream baseline advanced.", "2026-10-01: normal dispatch_f32 now caches prepared f32 kernels per GpuAdapter keyed by shader source + workgroup size; forced Vulkan validation PASS; cached path matched prepared dispatch closely.", "2026-10-01: measured fresh-vs-resident GPU buffer paths; direct buffer/bind-group reuse improved only ~1-4%, so no generic buffer cache was promoted. Resident probe retained inside runtime-gpu-wgpu for future residency studies; no upstream baseline advanced.", "2026-10-01: M8 capability discovery now records adapter name/backend/device type behind the wgpu wrapper; runtime-api consumes backend-neutral GpuDeviceProfile values rather than wgpu AdapterInfo."]

