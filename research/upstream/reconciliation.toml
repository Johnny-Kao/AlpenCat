  upstream_change_policy = "attempt_pin_removal_then_validate"
  validation = ["fresh dependency resolution", "Rust 1.87 cargo check --workspace"]

[[integration]]
id = "registered-range-task"
source_ids = ["rayon", "wgpu"]
downstream_unit = "crates/runtime-api/src/lib.rs::RangeTaskImplementations / Runtime::submit_range_task"
action = "connector_wrapper"
canonical_owner = "runtime-api registered range task contract"
semantic_contract = "one logical task registers a serial/CPU element implementation and an optional GPU implementation without exposing Rayon or wgpu types; GPU implementations may be range-aware so pending WorkUnits can be reassigned by the broker without changing task identity"
upstream_change_policy = "reconcile_each_source_wrapper_then_revalidate_shared_registration_contract"
validation = ["cargo test --workspace", "forced Vulkan registered vector_scale", "selector Auto serial/CPU/GPU/fallback tests"]
history = ["2026-10-01: removed caller-facing Runtime::submit_vector_scale special case; GPU execution now registers through GpuExecutionContext::dispatch_f32; full workspace tests PASS; forced Vulkan registered vector_scale PASS."]

